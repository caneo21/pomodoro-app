name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (core, phone, watch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local Windows JDK path; a command-line
      # -D property takes precedence over it, so point Gradle at the runner's JDK instead.
      - name: Unit tests and debug builds
        run: >
          ./gradlew --console=plain
          -Dorg.gradle.java.home="$JAVA_HOME"
          :core:test
          :app:testDebugUnitTest
          :wear:testDebugUnitTest
          :app:assembleDebug
          :wear:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            wear/build/reports/tests/
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Core tests
        run: dotnet test windows/PomodoroWindows.Core.Tests/PomodoroWindows.Core.Tests.csproj --logger "console;verbosity=normal"

      # Build only: PomodoroWindows.Tests needs WinUI types that aren't registered outside a packaged
      # app (every test fails with REGDB_E_CLASSNOTREG), so it isn't run here yet.
      - name: Build solution
        run: dotnet build windows/PomodoroWindows.sln
