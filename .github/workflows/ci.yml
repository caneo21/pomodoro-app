name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (core, phone, watch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to a local Windows JDK path; a command-line
      # -D property takes precedence over it, so point Gradle at the runner's JDK instead.
      # --continue runs every module's tests even if an earlier one fails.
      - name: Unit tests and debug builds
        shell: bash
        run: >
          ./gradlew --console=plain --continue
          -Dorg.gradle.java.home="$JAVA_HOME"
          :core:test
          :app:testDebugUnitTest
          :wear:testDebugUnitTest
          :app:assembleDebug
          :wear:assembleDebug
          2>&1 | tee gradle-output.log

      # Job logs need a GitHub login to read; annotations show on the PR for anyone. Emits one per
      # failing test, or the Gradle error lines if no test failed (e.g. a compile or config error).
      - name: Report failures as annotations
        if: failure()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET

          def esc(text, prop=False):
              text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if prop else text

          found = 0
          for path in sorted(glob.glob("*/build/test-results/**/*.xml", recursive=True)):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for f in case.findall("failure") + case.findall("error"):
                      lines = [(f.get("message") or "").strip()] + (f.text or "").strip().splitlines()[:12]
                      title = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title={esc(title, prop=True)}::{esc(chr(10).join(lines))}")
                      found += 1
          if not found:
              log = open("gradle-output.log", encoding="utf-8", errors="replace").read().splitlines()
              keys = ("e: ", "FAILURE", "* What went wrong", "> ", "Execution failed")
              lines = [l for l in log if l.startswith(keys)][:40] or log[-40:]
              print(f"::error title=Gradle build failed::{esc(chr(10).join(lines))}")

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            wear/build/reports/tests/
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Core tests
        run: dotnet test windows/PomodoroWindows.Core.Tests/PomodoroWindows.Core.Tests.csproj --logger "console;verbosity=normal"

      # Build only: PomodoroWindows.Tests needs WinUI types that aren't registered outside a packaged
      # app (every test fails with REGDB_E_CLASSNOTREG), so it isn't run here yet.
      - name: Build solution
        run: dotnet build windows/PomodoroWindows.sln
